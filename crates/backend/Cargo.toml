[package]
name = "backend"
authors.workspace = true
version.workspace = true
edition.workspace = true

[features]
default = ["libc_alloc"]
libc_alloc = ["dep:libc"]

[dependencies]
dbus.workspace = true
config.workspace = true
widgets.workspace = true
shared.workspace = true
filetype.path = "../filetype"

anyhow.workspace = true
async-io.workspace = true
async-channel.workspace = true
log.workspace = true
humantime.workspace = true
tempfile.workspace = true
skia-safe.workspace = true

derive_builder = "0.20.0"
wayland-client = "0.31.14"
wayland-protocols = { version = "0.32.12", features = ["client", "wayland-client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client", "wayland-client"] }
indexmap = "2.4.0"
chrono = "0.4.39"
libc = { version = "0.2.174", optional = true }
wayland-egl = "0.32.11"
khronos-egl = { version = "6.0.0", features = ["static"] }
